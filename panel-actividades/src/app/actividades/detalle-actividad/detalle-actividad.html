<a routerLink="/actividades">
  ← Volver a la lista
</a>

@if (actividad(); as a) {
  <article class="detalle">
    <h2>{{ a.titulo }}</h2>

    <p>
      Prioridad:
      {{ a.prioridad }}
    </p>

    <p>
      Estado:
      {{ a.estado }}
    </p>

    <p>
      Creada:
      {{ a.creadaEn }}
    </p>

    @if (a.descripcion) {
      <p class="descripcion">
        {{ a.descripcion }}
      </p>
    }

    <div class="acciones">
      <a
        [routerLink]="[
          '/actividades',
          a.id,
          'editar'
        ]"
      >
        Editar
      </a>

      <button
        type="button"
        [attr.aria-label]="'Eliminar ' + a.titulo"
        (click)="eliminar()"
      >
        Eliminar
      </button>
    </div>
  </article>
}
