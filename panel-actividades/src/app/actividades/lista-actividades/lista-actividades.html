<section class="lista">
  @for (actividad of actividades(); track actividad.id) {
    <article class="actividad">
      <app-tarjeta-actividad
        [actividad]="actividad"
        [seleccionada]="actividad.id === seleccionadaId()"
        (seleccionadaCambiada)="seleccionCambiada.emit(actividad.id)"
        (destacadaCambiada)="destacadoCambiado.emit(actividad.id)"
        (avanceSolicitado)="avanceSolicitado.emit(actividad.id)"
        (eliminacionSolicitada)="eliminacionSolicitada.emit(actividad.id)"
      />

      <a
        class="enlace-detalle"
        [routerLink]="['/actividades', actividad.id]"
      >
        Ver detalle de {{ actividad.titulo }}
      </a>
    </article>
  } @empty {
    <p>{{ mensajeVacio() }}</p>

    @if (hayFiltros()) {
      <button
        type="button"
        (click)="limpiezaSolicitada.emit()"
      >
        Limpiar filtros
      </button>
    }
  }
</section>
